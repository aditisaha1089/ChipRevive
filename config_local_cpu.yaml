checkpoint:
  best_metric: psnr
  dir: weights
  resume: ''
data:
  crop_size: 128
  gt_dir: data/raw/GT
  lr_dir: data/raw/NoisyLR
  num_workers: 0
  test_dir: data/test/NoisyLR
  val_ratio: 0.15
inference:
  device: auto
  output_dir: restored_outputs
  pad_multiple: 16
  weights_path: weights/best_model.pth
loss:
  charb_eps: 0.001
  w_charb: 1.0
  w_fft: 0.1
  w_sobel: 0.5
  w_ssim: 0.3
model:
  base_ch: 32
  do_sr: true
  embed_dim: 64
  in_ch: 1
  num_blocks: 8
  sr_scale: 2
training:
  amp: false
  batch_size: 8
  epochs: 15
  grad_clip: 1.0
  log_interval: 50
  lr: 0.0002
  lr_min: 1.0e-06
  save_interval: 5
  seed: 42
  val_interval: 1
  weight_decay: 0.0001
